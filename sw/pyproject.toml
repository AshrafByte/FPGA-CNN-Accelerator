[project]
name = "sw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",  # ImageFont.load_default(size=...) labels the PNG grids
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "hardware: simulates conv_image_tb under QuestaSim; skipped when vsim is not on PATH",
]
